plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def groqApiKey = localProperties.getProperty("GROQ_API_KEY", "")
def escapedGroqApiKey = groqApiKey
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
        .replace("\r", "\\r")
        .replace("\n", "\\n")

android {
    namespace 'com.example.aimentor'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.aimentor"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GROQ_API_KEY", "\"${escapedGroqApiKey}\""
        buildConfigField "String", "GROQ_BASE_URL", "\"https://api.groq.com/\""
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

def verifyReleaseConfiguration = tasks.register("verifyReleaseConfiguration") {
    group = "verification"
    description = "Fails a release build when the classroom Groq configuration is missing."
    doLast {
        if (groqApiKey.trim().isEmpty()) {
            throw new GradleException(
                    "Release AI configuration is missing. Add GROQ_API_KEY to local.properties.")
        }
        if (!groqApiKey.trim().startsWith("gsk_")) {
            throw new GradleException(
                    "Release AI configuration is invalid. GROQ_API_KEY must be a Groq key.")
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn verifyReleaseConfiguration
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.viewpager2
    implementation libs.swiperefreshlayout
    implementation libs.room.runtime
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.dnsoverhttps
    implementation libs.gson
    implementation libs.mlkit.text.recognition
    implementation libs.work.runtime
    annotationProcessor libs.room.compiler
    testImplementation libs.junit
    testImplementation libs.mockwebserver
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
